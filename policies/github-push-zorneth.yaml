#
# OpenShell-style GitHub write base policy for org whaleshell.
# Builtin github *provider*: API read-only + git-upload-pack only.
# This file is the sandbox *base* widen (create repo + push) — same loop as
# OpenShell: default deny → DENIED in logs → policy set → retry.
#
#   whaleshell sandbox create --name push --policy whaleshell-cli/policies/github-push-whaleshell.yaml \
#     --gateway … --provider gh
#   # or on a running sandbox:
#   whaleshell policy set <sandbox> whaleshell-cli/policies/github-push-whaleshell.yaml

version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /tmp
  read_write:
  - /tmp
  - /dev/null
  - /workspace
  - /whaleshell/data
landlock:
  compatibility: best_effort
network_policies:
  github-api-whaleshell:
    name: github-api-whaleshell
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      credential_keys:
      - GITHUB_TOKEN
      - GH_TOKEN
      rules:
      - allow:
          method: GET
          path: /repos/whaleshell/**
      - allow:
          method: HEAD
          path: /repos/whaleshell/**
      - allow:
          method: POST
          path: /repos/whaleshell/**
      - allow:
          method: PUT
          path: /repos/whaleshell/**
      - allow:
          method: PATCH
          path: /repos/whaleshell/**
      - allow:
          method: DELETE
          path: /repos/whaleshell/**
      - allow:
          method: POST
          path: /orgs/whaleshell/repos
      - allow:
          method: GET
          path: /orgs/whaleshell
      - allow:
          method: GET
          path: /orgs/whaleshell/**
      - allow:
          method: POST
          path: /user/repos
      - allow:
          method: GET
          path: /user
      - allow:
          method: GET
          path: /user/**
    binaries:
    - path: /usr/bin/gh
    - path: /usr/local/bin/gh
    - path: /usr/bin/curl
    - path: /usr/local/bin/curl
    - path: /usr/bin/git
    - path: /usr/local/bin/git
  github-graphql:
    name: github-graphql
    endpoints:
    - host: api.github.com
      port: 443
      path: /graphql
      protocol: graphql
      tls: terminate
      access: read-write
      enforcement: enforce
      credential_keys:
      - GITHUB_TOKEN
      - GH_TOKEN
    binaries:
    - path: /usr/bin/gh
    - path: /usr/local/bin/gh
  github-git-whaleshell:
    name: github-git-whaleshell
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      credential_keys:
      - GITHUB_TOKEN
      - GH_TOKEN
      rules:
      - allow:
          method: GET
          path: /whaleshell/**
      - allow:
          method: HEAD
          path: /whaleshell/**
      - allow:
          method: POST
          path: /whaleshell/**/git-upload-pack
      - allow:
          method: POST
          path: /whaleshell/**/git-receive-pack
    binaries:
    - path: /usr/bin/git
    - path: /usr/local/bin/git
credentials:
  env_allow:
  - TERM
  - LANG
  - COLORTERM
  - GITHUB_TOKEN
  - GH_TOKEN
  write_to_disk: false
