version: "3"

vars:
  ORG: '{{.ORG | default .ROOT_DIR}}'

tasks:
  agent:cursor:
    desc: Build whaleshell-sandbox:cursor (Cursor Agent CLI)
    cmds:
      - |
        set -euo pipefail
        ORG="{{.ORG}}"
        if ! docker image inspect whaleshell-sandbox:local >/dev/null 2>&1; then
          echo "building base whaleshell-sandbox:local …"
          task -d "$ORG" runtime:image:cli
        fi
        docker build -t whaleshell-sandbox:cursor \
          --build-arg BASE_IMAGE=whaleshell-sandbox:local \
          -f "$ORG/whaleshell-cli/docker/agents/cursor/Dockerfile" \
          "$ORG/whaleshell-cli/docker/agents/cursor"
        echo "ok: whaleshell-sandbox:cursor"

  agent:claude:
    desc: Build whaleshell-sandbox:claude (Claude Code CLI)
    cmds:
      - |
        set -euo pipefail
        ORG="{{.ORG}}"
        if ! docker image inspect whaleshell-sandbox:local >/dev/null 2>&1; then
          task -d "$ORG" runtime:image:cli
        fi
        docker build -t whaleshell-sandbox:claude \
          --build-arg BASE_IMAGE=whaleshell-sandbox:local \
          -f "$ORG/whaleshell-cli/docker/agents/claude/Dockerfile" \
          "$ORG/whaleshell-cli/docker/agents/claude"
        echo "ok: whaleshell-sandbox:claude"

  agent:codex:
    desc: Build whaleshell-sandbox:codex (OpenAI Codex CLI)
    cmds:
      - |
        set -euo pipefail
        ORG="{{.ORG}}"
        if ! docker image inspect whaleshell-sandbox:local >/dev/null 2>&1; then
          task -d "$ORG" runtime:image:cli
        fi
        docker build -t whaleshell-sandbox:codex \
          --build-arg BASE_IMAGE=whaleshell-sandbox:local \
          -f "$ORG/whaleshell-cli/docker/agents/codex/Dockerfile" \
          "$ORG/whaleshell-cli/docker/agents/codex"
        echo "ok: whaleshell-sandbox:codex"

  agent:all:
    desc: Build cursor + claude + codex images
    cmds:
      - task: agent:cursor
      - task: agent:claude
      - task: agent:codex
