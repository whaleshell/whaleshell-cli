name: images-agents

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  pull_request:
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/whaleshell/whaleshell/sandboxes
  # Local tag only — GHCR base is private to whaleshell-runtime; buildx container
  # driver cannot pull it. Always build FROM a local docker-tagged base.
  LOCAL_BASE: whaleshell-sandbox:base
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [cursor, claude, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          path: whaleshell-cli
      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main
      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main
      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main
      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ github.workspace }}/go.work" <<'EOF'
          go 1.27.0
          use (
            ./whaleshell-runtime
            ./whaleshell-core
            ./whaleshell-driver
            ./whaleshell-proxy
            ./slogx
          )
          replace (
            github.com/whaleshell/whaleshell-runtime v0.1.0-alpha.1 => ./whaleshell-runtime
            github.com/whaleshell/whaleshell-core v0.1.0-alpha.1 => ./whaleshell-core
            github.com/whaleshell/whaleshell-driver v0.1.0-alpha.1 => ./whaleshell-driver
            github.com/whaleshell/whaleshell-proxy v0.1.0-alpha.1 => ./whaleshell-proxy
            github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx
          )
          EOF
          # strip leading spaces from heredoc body
          sed -i 's/^          //' "${{ github.workspace }}/go.work"
          cat "${{ github.workspace }}/go.work"


      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      # docker driver sees locally tagged images (container driver cannot).
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local base
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C whaleshell-runtime -o images/sandbox/whaleshell-init ./cmd/whaleshell-init
          docker build -t "${LOCAL_BASE}" --target cli \
            -f whaleshell-runtime/images/sandbox/Dockerfile \
            whaleshell-runtime/images/sandbox
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: whaleshell-cli/docker/agents/${{ matrix.agent }}
          file: whaleshell-cli/docker/agents/${{ matrix.agent }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE }}
