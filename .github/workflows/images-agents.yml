name: images-agents

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  pull_request:
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/zorneth/osg/sandboxes
  # Local tag only — GHCR base is private to whaleshell-runtime; buildx container
  # driver cannot pull it. Always build FROM a local docker-tagged base.
  LOCAL_BASE: whaleshell-sandbox:base
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [cursor, claude, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          path: whaleshell-cli
      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: whaleshell-runtime
          ref: main
      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: whaleshell-core
          ref: main
      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: whaleshell-driver
          ref: main
      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - name: Write go.work
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      # docker driver sees locally tagged images (container driver cannot).
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local base
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C whaleshell-runtime -o images/sandbox/whaleshell-init ./cmd/whaleshell-init
          docker build -t "${LOCAL_BASE}" --target cli \
            -f whaleshell-runtime/images/sandbox/Dockerfile \
            whaleshell-runtime/images/sandbox
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: whaleshell-cli/docker/agents/${{ matrix.agent }}
          file: whaleshell-cli/docker/agents/${{ matrix.agent }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE }}
