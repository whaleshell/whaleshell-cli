name: images-agents

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  pull_request:
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/zorneth/osg/sandboxes
  BASE_IMAGE: ghcr.io/zorneth/osg/sandboxes/base:latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [cursor, claude, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          path: osg-cli
      - name: Checkout osg-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: osg-runtime
          ref: main
      - name: Checkout osg-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: osg-core
          ref: main
      - name: Checkout osg-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: osg-driver
          ref: main
      - name: Checkout osg-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: osg-proxy
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve base image
        run: |
          set -euo pipefail
          if docker pull "${BASE_IMAGE}"; then
            echo "Using published ${BASE_IMAGE}"
            exit 0
          fi
          echo "Published base unavailable; building local ${BASE_IMAGE} from osg-runtime"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C osg-runtime -o images/sandbox/osg-init ./cmd/osg-init
          docker build -t "${BASE_IMAGE}" --target cli \
            -f osg-runtime/images/sandbox/Dockerfile \
            osg-runtime/images/sandbox
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: osg-cli/docker/agents/${{ matrix.agent }}
          file: osg-cli/docker/agents/${{ matrix.agent }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
