# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-cli
    steps:

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          path: whaleshell-cli

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-display
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-display
          path: whaleshell-display
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-sdk
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-sdk
          path: whaleshell-sdk
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-cli
    steps:

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          path: whaleshell-cli

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-display
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-display
          path: whaleshell-display
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-sdk
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-sdk
          path: whaleshell-sdk
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: whaleshell-cli
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-cli
    steps:

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          path: whaleshell-cli

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-display
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-display
          path: whaleshell-display
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-sdk
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-sdk
          path: whaleshell-sdk
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-cli
    steps:

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          path: whaleshell-cli

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-display
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-display
          path: whaleshell-display
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-sdk
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-sdk
          path: whaleshell-sdk
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./whaleshell-cli/coverage.txt
          flags: unittests
          name: codecov-whaleshell-cli
          fail_ci_if_error: false

  release-dry-run:
    name: Release archives + install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          path: whaleshell-cli
          fetch-depth: 0

      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          for m in whaleshell-core whaleshell-display whaleshell-driver whaleshell-providers \
                   whaleshell-proxy whaleshell-runtime whaleshell-sdk whaleshell-gateway slogx; do
            git clone --depth 1 "https://github.com/whaleshell/${m}.git" "${m}"
          done

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do echo "  ./$d"; done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"; done
            echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            echo ')'
          } > go.work

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: whaleshell-cli
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local

      - name: Verify archive layout and install.sh
        working-directory: whaleshell-cli
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/whaleshell_Linux_x86_64.tar.gz dist/whaleshell_Darwin_arm64.tar.gz; do
            arch=amd64; [[ "$a" == *arm64* ]] && arch=arm64
            list="$(tar -tzf "$a")"
            for f in whaleshell whaleshell-gateway \
                     "libexec/whaleshell/linux-${arch}/whaleshell" \
                     "libexec/whaleshell/linux-${arch}/whaleshell-init" \
                     "libexec/whaleshell/linux-${arch}/whaleshell-sshd"; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
          done
          unzip -l dist/whaleshell_Windows_x86_64.zip | grep -q "libexec/whaleshell/linux-amd64/whaleshell-sshd"

          mkdir -p /tmp/rel && ln -s "$PWD/dist" /tmp/rel/snapshot
          WHALESHELL_RELEASE_URL=file:///tmp/rel WHALESHELL_VERSION=snapshot \
            WHALESHELL_INSTALL_DIR=/tmp/prefix/bin sh ./install.sh
          test -x /tmp/prefix/bin/whaleshell
          test -x /tmp/prefix/bin/whaleshell-gateway
          test -x /tmp/prefix/libexec/whaleshell/linux-amd64/whaleshell-sshd
          /tmp/prefix/bin/whaleshell version
