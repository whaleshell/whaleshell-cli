# Cursor Agent credentials + API hosts (OpenShell-style agent provider).
# OpenShell's builtin cursor profile is network-only (editor bootstrap);
# agent API keys for Claude Code / Codex go through providers — we do the
# same for CURSOR_API_KEY so secrets are endpoint-bound, not policy env_allow.
#
# inject_env: false — Cursor Agent CLI validates CURSOR_API_KEY client-side and
# rejects osg:resolve:env placeholders ("invalid API key"). Prefer `agent login`
# (OAuth → auth.json). The secret still lives in the gateway store / sidecar for
# rewrite if a request carries the placeholder; it is not injected into guest env.

id: cursor
display_name: Cursor Agent
description: Cursor Agent CLI API key and *.cursor.sh / *.cursor.com egress
category: agent
binaries:
  - /usr/bin/agent
  - /usr/local/bin/agent
  - /usr/local/bin/cursor-agent
  - /opt/cursor-agent/**
  - /opt/cursor-agent/versions/*/node
  - /opt/cursor-agent/versions/*/cursor-agent
  - /usr/bin/curl
  - /usr/local/bin/curl
credentials:
  - name: api_key
    env_vars: [CURSOR_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
    inject_env: false
endpoints:
  - id: api2
    host: api2.cursor.sh
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: api
    host: api.cursor.sh
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: cursor-sh
    host: "**.cursor.sh"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: cursor-com
    host: "**.cursor.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: cursor-com-apex
    host: cursor.com
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  # Bootstrap / updates (OpenShell cursor profile parity; no extra secrets)
  - id: blob
    host: cursor.blob.core.windows.net
    port: 443
  - id: downloads
    host: downloads.cursor.com
    port: 443
  - id: download-sh
    host: download.cursor.sh
    port: 443
  - id: ms-cdn
    host: cursor.download.prss.microsoft.com
    port: 443
